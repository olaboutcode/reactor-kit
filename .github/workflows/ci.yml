name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  net10:
    name: Build net10.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        run: dotnet workload restore src/ReactorKit/ReactorKit.csproj -p:TargetFrameworks=net10.0

      - name: Build library
        run: >
          dotnet build src/ReactorKit/ReactorKit.csproj
          -c Release
          -f net10.0
          -p:TargetFrameworks=net10.0

  android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install MAUI Android
        run: dotnet workload install maui-android

      - name: Build library
        run: dotnet build src/ReactorKit/ReactorKit.csproj -c Release -f net10.0-android

  ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI iOS
        run: dotnet workload install maui-ios

      - name: Build library
        # macOS TargetFrameworks also list android/maccatalyst; restore only iOS
        # so this job does not require those workloads (NETSDK1147).
        run: >
          dotnet build src/ReactorKit/ReactorKit.csproj
          -c Release
          -f net10.0-ios
          -p:TargetFrameworks=net10.0-ios
